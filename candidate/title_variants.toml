# Title variants per Target Role. Decides which Job Postings enter the Knowledge Base.
#
# A posting gets the FIRST role below that has an `include` phrase in its title and no
# `exclude` phrase. Phrases match case-insensitively and as whole words only
# ("ai" does not match "Maintenance"). After editing, re-tag with:
#     uv run turing-projects-v2 tag
# and review the matched titles with:
#     uv run turing-projects-v2 review-titles
#
# STATUS: reviewed by the candidate on 2026-10-23 (1,108 postings tagged).

[[role]]
name = "Quantum Software Developer"
# Only "quantum" itself: "optimization" titles in this dataset are SEO / process jobs.
include = ["quantum", "qiskit", "qubit", "qubits"]
exclude = []

[[role]]
name = "Grant Management Specialist"
include = [
    "grant",
    "grants",
    "grants management",
    "grant management",
    "research administration",
    "research administrator",
    "sponsored programs",
    "sponsored research",
    "pre-award",
    "post-award",
    "proposal manager",
    "proposal management",
    "proposal writer",
    "proposal coordinator",
    "proposal specialist",
    "proposal analyst",
    "fundraising",
    "director of development",
    "development director",
    "development officer",
    "major gift",
    "major gifts",
    "philanthropy",
    "philanthropic",
    "donor relations",
]
exclude = [
    "grants pass",        # a town in Oregon
    "grant grove",        # a place name
    "grant funded",       # grant-funded social-work jobs
    "grant-funded",
    "payment collector",
    "grant writer",       # candidate: writing grants is not grant management
    "grants writer",
    "grant writing",
    "grants writing",
    "accountant",         # candidate: grant accounting is out
    "volunteer",          # candidate: no unpaid posts
]

[[role]]
name = "AI Innovation Manager"
include = [
    "innovation manager",
    "innovation management",
    "innovation lead",
    "innovation leader",
    "innovation director",
    "director of innovation",
    "head of innovation",
    "innovation office",
    "chief ai officer",
    "ai strategy",
    "ai product manager",
    "product manager (ai)",
    "ai program manager",
    "ai transformation",
    "emerging technologies",
]
exclude = [
    "brand",              # candidate: AI/tech innovation only, not consumer-brand innovation
    "technologies engineer",  # "Emerging Technologies Engineer" is not a management role
    "it advisor",
]

