[project]
name = "turing-projects-v2"
version = "0.0.0"
description = "Chatbot that finds matching job postings and writes cover letters without inventing facts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.7.0",
    "pydantic-settings>=2.16.1",
]

[project.scripts]
turing-projects-v2 = "turing_projects_v2:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
