[project]
name = "turing-projects-v2"
version = "2.0.0"
description = "Chatbot that finds matching job postings and writes cover letters without inventing facts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.3",
    "python-docx>=1.2.0",
    "ragas>=0.4.3",
    # Not imported here: RAGAs' test-set generator needs it and does not declare it.
    "rapidfuzz>=3.14.6",
    "reportlab>=5.1.0",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "tqdm>=4.70.1",
]

[project.scripts]
turing-projects-v2 = "turing_projects_v2.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# RAGAs declares scikit-network but never imports it; it has no Python 3.14 wheel and would need a
# C compiler on Windows, so it is left out.
override-dependencies = ["scikit-network; sys_platform == 'never'"]
# RAGAs 0.4.3 imports langchain_community.chat_models.vertexai, which 0.4.2 removed.
constraint-dependencies = ["langchain-community<0.4.2"]
